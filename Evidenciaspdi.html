<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerias de Evidências - Prof. Eliza Giliolli</title>
<style>
  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: url('estrelas.gif') center center / cover no-repeat fixed;
    color: #fff;
  }

  header {
    background: rgba(10,10,40,0.8);
    padding: 20px;
    text-align: center;
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 8px #ffd700;
  }

  main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
  }

  .galeria {
    margin-bottom: 50px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 30px;
  }

  .galeria h2 {
    text-align: center;
    color: #ffd700;
    text-shadow: 0 0 6px #fff4a3;
    margin-bottom: 10px;
  }

  .descricao {
    text-align: center;
    color: #ccc;
    margin-bottom: 25px;
    font-style: italic;
  }

  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }

  .foto {
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }

  .foto img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
    border-radius: 12px;
  }

  .foto:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
  }

  footer {
    text-align: center;
    padding: 25px;
    background: rgba(10,10,40,0.9);
    color: #ccc;
    font-size: 0.9rem;
    margin-top: 40px;
  }

  /* ===== MODAL DE IMAGEM ===== */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  #modal img {
    max-width: 90%;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(255,255,255,0.4);
    animation: zoomIn 0.3s ease;
  }

  @keyframes zoomIn {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #fechar {
    position: fixed;
    top: 20px;
    right: 30px;
    color: #fff;
    background: rgba(255,255,255,0.2);
    border: none;
    font-size: 2rem;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    z-index: 10000;
  }

  #fechar:hover {
    background: rgba(255,255,255,0.4);
  }

  @media (max-width: 600px) {
    .foto img { height: 160px; }
    header { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>Galerias de Evidências — Prof. Eliza Giliolli</header>

<main>

  <!-- ===== GALERIA 1 ===== -->
  <div class="galeria">
    <h2>Formação EFAPE</h2>

    <div class="grid">
      <div class="foto"><img src="fotos2/WhatsApp Image 2025-10-30 at 19.39.15.jpeg" alt=""></div>

      <div class="foto"><img src="fotos/7.jpeg" alt=""></div>
      <div class="foto"><img src="fotos/8.jpeg" alt=""></div>

      <div class="foto"><img src="fotos/12.jpeg" alt=""></div>
      <div class="foto"><img src="fotos/13.jpeg" alt=""></div>
      <div class="foto"><img src="fotos/14.jpeg" alt=""></div>
      <div class="foto"><img src="fotos/15.jpeg" alt=""></div>
      <div class="foto"><img src="fotos/17.jpeg" alt=""></div>
      <div class="foto"><img src="fotos/18.jpeg" alt=""></div>

<footer>
  © 2025 Prof. Eliza Giliolli — Todos os direitos reservados
</footer>

<!-- ===== MODAL ===== -->
<div id="modal">
  <button id="fechar">×</button>
  <img id="modal-img" src="">
</div>

<script>
  const fotos = document.querySelectorAll(".foto img");
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modal-img");
  const fechar = document.getElementById("fechar");

  fotos.forEach(img => {
    img.addEventListener("click", () => {
      modal.style.display = "flex";
      modalImg.src = img.src;
    });
  });

  fechar.addEventListener("click", () => modal.style.display = "none");
  modal.addEventListener("click", e => {
    if (e.target === modal) modal.style.display = "none";
  });
</script>

</body>
</html>
