<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerias de Evidências - Prof. Eliza Giliolli</title>
<style>
  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: url('estrelas.gif') center center / cover no-repeat fixed;
    color: #fff;
  }

  header {
    background: rgba(10,10,40,0.8);
    padding: 20px;
    text-align: center;
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 8px #ffd700;
  }

  main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
  }

  .galeria {
    margin-bottom: 50px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 30px;
  }

  .galeria h2 {
    text-align: center;
    color: #ffd700;
    text-shadow: 0 0 6px #fff4a3;
    margin-bottom: 10px;
  }

  .descricao {
    text-align: center;
    color: #ccc;
    margin-bottom: 25px;
    font-style: italic;
  }

  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }

  .foto {
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .foto img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
    border-radius: 12px;
  }

  .foto:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
  }

  footer {
    text-align: center;
    padding: 25px;
    background: rgba(10,10,40,0.9);
    color: #ccc;
    font-size: 0.9rem;
    margin-top: 40px;
  }

  @media (max-width: 600px) {
    .foto img { height: 160px; }
    header { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>Galerias de Evidências — Prof. Eliza Giliolli</header>

<main>

  <!-- ===== GALERIA 1 ===== -->
  <div class="galeria">
    <h2>Formação EFAPE</h2>
    <p class="descricao">Evidencias Efape</p>
    <div class="grid">
      <div class="foto"><img src="" alt=""></div>
      <div class="foto"><img src="" alt=""></div>
      <div class="foto"><img src="" alt=""></div>
    </div>
  </div>

  <!-- ===== GALERIA 2 ===== -->
  <div class="galeria">
    <h2>Formação e leitura</h2>
    <p class="descricao">Formação - Livros evidênciados .</p>
    <div class="grid">
      <div class="foto"><img src="" alt=""></div>
      <div class="foto"><img src="" alt=""></div>
      <div class="foto"><img src="" alt=""></div>
    </div>
  </div>

  <!-- ===== GALERIA 3 ===== -->
  <div class="galeria">
    <h2>Gestão Sala de Aula</h2>
    <p class="descricao">Evidencias projeto de Gestão Sala de Aula.</p>
    <div class="grid">
      <div class="foto"><img src="" alt=""></div>
      <div class="foto"><img src="" alt=""></div>
      <div class="foto"><img src="" alt=""></div>
    </div>
  </div>

</main>

<footer>
  © 2025 Prof. Eliza Giliolli — Todos os direitos reservados
</footer>

</body>
</html>
