<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Evidências - Prof. Eliza Giliolli</title>
  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      background: url('estrelas.gif') center center / cover no-repeat fixed;
      cursor: none;
      touch-action: none; /* evita scroll acidental no toque */
    }

    header {
      background: rgba(10, 10, 40, 0.7);
      backdrop-filter: blur(6px);
      padding: 16px 0;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 5;
      position: relative;
    }

    nav {
      display: flex;
      justify-content: center;
      background: rgba(30, 30, 60, 0.7);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      position: relative;
      z-index: 5;
      flex-wrap: wrap;
    }

    nav a {
      color: #e0e0ff;
      text-decoration: none;
      padding: 14px 22px;
      display: block;
      transition: 0.3s;
    }

    nav a:hover {
      background: rgba(255,255,255,0.2);
      color: #ffd700;
      cursor: pointer;
    }

    .submenu {
      display: none;
      flex-direction: column;
      background: rgba(10, 10, 40, 0.9);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .submenu a {
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .menu-item {
      position: relative;
    }

    .menu-item:hover .submenu {
      display: flex;
      position: absolute;
      top: 100%;
      left: 0;
      width: 220px;
      z-index: 99;
    }

    main {
      max-width: 900px;
      margin: 70px auto;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255,255,255,0.15);
      text-align: center;
      position: relative;
      z-index: 3;
      backdrop-filter: blur(6px);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: rgba(10, 10, 40, 0.8);
      color: #ccc;
      font-size: 0.9rem;
      margin-top: 50px;
      z-index: 3;
      position: relative;
    }

    /* ======== ESTRELAS ======== */
    .estrela {
      position: fixed;
      width: 24px;
      height: 24px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 10;
      filter: drop-shadow(0 0 10px currentColor)
              drop-shadow(0 0 20px currentColor)
              drop-shadow(0 0 30px currentColor);
      transition: filter 0.3s ease;
    }

    @keyframes brilho {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    @keyframes fade {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.2); }
    }

    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      opacity: 0.9;
      animation: fade 1s linear forwards;
    }
  </style>
</head>
<body>

  <header>ELIZA GILIOLLI</header>

  <nav>
    <a href="#">Início</a>
    <div class="menu-item">
      <a href="#">Galerias ▼</a>
      <div class="submenu">
        <a href="#">EVIDÊNCIAS PDI-2025</a>
        <a href="#">EVIDÊNCIAS GERAIS-2025</a>
        <a href="#">Projetos</a>
      </div>
    </div>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
  </nav>

  <main>
    <h2>Bem-vindo!</h2>
    <p><b>Professora Eliza Giliolli</b> — Evidências Digitais 2025</p>
    <p>Escola Monsenhor Bicudo — Ensino Integral</p>
  </main>

  <footer>
    © 2025 Prof. Eliza Giliolli — Todos os direitos reservados
  </footer>

  <!-- 4 Estrelas -->
  <svg class="estrela" id="estrela1" viewBox="0 0 64 64" fill="gold">
    <polygon points="32,2 39,24 62,24 43,38 50,60 32,47 14,60 21,38 2,24 25,24"/>
  </svg>
  <svg class="estrela" id="estrela2" viewBox="0 0 64 64" fill="#ff69b4">
    <polygon points="32,2 39,24 62,24 43,38 50,60 32,47 14,60 21,38 2,24 25,24"/>
  </svg>
  <svg class="estrela" id="estrela3" viewBox="0 0 64 64" fill="#66ccff">
    <polygon points="32,2 39,24 62,24 43,38 50,60 32,47 14,60 21,38 2,24 25,24"/>
  </svg>
  <svg class="estrela" id="estrela4" viewBox="0 0 64 64" fill="#a6ff9c">
    <polygon points="32,2 39,24 62,24 43,38 50,60 32,47 14,60 21,38 2,24 25,24"/>
  </svg>

  <div id="trail"></div>

  <script>
    const cores = ["#ffd700", "#ff69b4", "#66ccff", "#a6ff9c"];
    const estrelas = cores.map((cor, i) => ({
      el: document.getElementById(`estrela${i+1}`),
      color: cor,
      x: window.innerWidth / 2,
      y: window.innerHeight / 2
    }));

    const trail = document.getElementById("trail");
    let tx = window.innerWidth / 2, ty = window.innerHeight / 2;
    let ultimaMov = Date.now();

    function atualizarPos(e) {
      const toque = e.touches ? e.touches[0] : e;
      tx = toque.clientX;
      ty = toque.clientY;
      ultimaMov = Date.now();
    }

    document.addEventListener("mousemove", atualizarPos);
    document.addEventListener("touchmove", atualizarPos, { passive: true });

    function animate() {
      const agora = Date.now();
      const parado = agora - ultimaMov > 1000;

      estrelas.forEach((estrela, i) => {
        estrela.x += (tx - estrela.x) * (0.1 + i * 0.03);
        estrela.y += (ty - estrela.y) * (0.1 + i * 0.03);
        estrela.el.style.left = estrela.x + "px";
        estrela.el.style.top = estrela.y + "px";

        // muda cor se parado
        if (parado) {
          const hue = (agora / 20 + i * 90) % 360;
          estrela.el.style.fill = `hsl(${hue}, 100%, 65%)`;
          estrela.el.style.filter = `drop-shadow(0 0 10px hsl(${hue},100%,65%))
                                     drop-shadow(0 0 20px hsl(${hue},100%,70%))`;
        } else {
          estrela.el.style.fill = estrela.color;
        }

        // rastro tipo cometa
        if (Math.random() < 0.4) {
          const s = document.createElement("div");
          s.className = "sparkle";
          s.style.left = estrela.x + "px";
          s.style.top = estrela.y + "px";
          s.style.background = `radial-gradient(circle, ${estrela.color} 0%, transparent 70%)`;
          trail.appendChild(s);
          setTimeout(() => s.remove(), 800);
        }
      });
      requestAnimationFrame(animate);
    }
    animate();

    // interação nos links (brilho mais forte)
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("mouseenter", () => {
        estrelas.forEach(e => e.el.style.filter = "drop-shadow(0 0 25px #fff) drop-shadow(0 0 50px #ffea70)");
      });
      link.addEventListener("mouseleave", () => {
        estrelas.forEach((e, i) => e.el.style.filter =
          `drop-shadow(0 0 10px ${e.color}) drop-shadow(0 0 25px ${e.color})`);
      });
    });
  </script>

</body>
</html>
